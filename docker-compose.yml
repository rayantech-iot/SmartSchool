version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: smartschool-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: smartschool
      MYSQL_USER: smartschool
      MYSQL_PASSWORD: smartschool_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - smartschool-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: smartschool-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: smartschool
      DB_PASSWORD: smartschool_pass
      DB_NAME: smartschool
      SESSION_SECRET: changer_cette_cle_en_production
      APP_URL: https://smartschool.tg
    volumes:
      - uploads_data:/app/public/uploads
    networks:
      - smartschool-net

  web:
    image: nginx:stable-alpine
    container_name: smartschool-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads_data:/app/public/uploads:ro
    networks:
      - smartschool-net

volumes:
  mysql_data:
  uploads_data:

networks:
  smartschool-net:
    driver: bridge
